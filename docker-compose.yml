name: online-cinema-analytics

services:
  # ---------------------------------------------------------------- ZooKeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/2181'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------------------ Kafka
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    hostname: kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    ports:
      - "29092:29092"
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    hostname: kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    ports:
      - "29093:29093"
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  # --------------------------------------------------------- Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8081/subjects > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---------------------------------------- init: топик + схема (однократно)
  kafka-init:
    build: ./services/kafka-init
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: movie-events
      TOPIC_PARTITIONS: 3
      TOPIC_REPLICATION_FACTOR: 2
      TOPIC_MIN_INSYNC_REPLICAS: 1
    volumes:
      - ./schemas:/schemas:ro
    restart: "no"

  # -------------------------------------------------------------- ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse
    hostname: clickhouse
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --query "SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # -------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # -------------------------------------------------------------- S3 (S3Mock)
  minio:
    image: adobe/s3mock:latest
    container_name: minio
    hostname: minio
    environment:
      initialBuckets: movie-analytics   # бакет создаётся автоматически при старте
      root: /data
    ports:
      - "9000:9090"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------- Movie Service (Producer)
  producer:
    build: ./services/producer
    container_name: producer
    hostname: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: movie-events
      GENERATOR_ENABLED: "true"
      GENERATOR_USERS: "2000"
      GENERATOR_HISTORY_DAYS: "14"
      GENERATOR_BATCH_SIZE: "300"
      GENERATOR_INTERVAL_SECONDS: "3"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)" > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ------------------------------------------------- Aggregation Service
  aggregator:
    build: ./services/aggregator
    container_name: aggregator
    hostname: aggregator
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      AGGREGATION_INTERVAL_SECONDS: "60"
      AGGREGATION_WINDOW_DAYS: "14"
      EXPORT_INTERVAL_SECONDS: "120"
      EXPORT_DAYS_BACK: "1"
      S3_ENDPOINT: http://minio:9090
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: movie-analytics
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8001/health',timeout=5)" > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------------ Grafana
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    hostname: grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/api/health > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 18
      start_period: 30s

  # ------------------------------------------------------------ Test runner
  # depends_on намеренно не указываем: conftest сам ждёт готовности сервисов
  # по HTTP, а `compose run` не должен пересоздавать зависимости.
  test-runner:
    build: ./tests
    container_name: test-runner
    profiles: ["test"]
    environment:
      PRODUCER_URL: http://producer:8000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    restart: "no"

volumes:
  ch_data:
  pg_data:
  minio_data:
  grafana_data:
